<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cloverdale — 2018 / 2024</title>
<style>
  :root{ --seam:50%; --tx:0px; --ty:0px; --s:1; --L:100vmax; --line:#f4f1ea; --ink:#14110d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

  /* frame fills the entire viewport */
  .frame{position:fixed; inset:0; width:100vw; height:100dvh;
    overflow:hidden; touch-action:none; cursor:ew-resize; background:#000;}

  .pane{position:absolute; inset:0; overflow:hidden;}
  #topPane{clip-path:inset(0 calc(100% - var(--seam)) 0 0);}
  /* square image rendered whole, sized to --L, moved by shared transform */
  .layer{position:absolute; top:0; left:0; width:var(--L); height:var(--L);
    object-fit:fill; pointer-events:none; -webkit-user-drag:none;
    transform:translate(var(--tx),var(--ty)) scale(var(--s));
    transform-origin:0 0; will-change:transform;}

  .tag{position:absolute; top:0; padding:12px 15px 14px; z-index:4;
    color:var(--line); pointer-events:none;
    text-shadow:0 1px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.95);}
  .tag.l{left:0} .tag.r{right:0;text-align:right}
  .tag .yr{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(30px,6.5vw,64px); font-weight:600; line-height:.92; letter-spacing:-.01em;}
  .tag .src{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:clamp(8px,2.6vw,11px); letter-spacing:.06em; opacity:.92; margin-top:5px;
    text-transform:uppercase;}

  .seam{position:absolute; top:0; bottom:0; left:var(--seam);
    width:2px; margin-left:-1px; background:var(--line);
    box-shadow:0 0 0 .5px rgba(0,0,0,.4),0 0 18px rgba(0,0,0,.5); z-index:5; pointer-events:none;}
  .knob{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%; background:var(--line); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:2px;
    box-shadow:0 2px 10px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.15);}
  .knob svg{width:13px;height:13px;display:block;opacity:.85}
  .knob .a{transform:rotate(180deg)}

  .zc{position:absolute; right:12px; bottom:max(12px,env(safe-area-inset-bottom)); z-index:7;
    display:flex; flex-direction:column; gap:6px;}
  .zc button{width:40px;height:40px;border:none;border-radius:11px;cursor:pointer;
    background:rgba(20,17,13,.55); color:var(--line);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    font-family:ui-monospace,Menlo,monospace; font-size:20px; line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(244,241,234,.14);}
  .zc button:active{background:rgba(244,241,234,.9);color:var(--ink)}
  .zc .lbl{font-size:11px;letter-spacing:.02em}

  .hint{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:6;
    color:var(--line); font-family:ui-monospace,Menlo,monospace; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; opacity:0; pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.85); animation:hint 5s ease forwards; text-align:center;}
  @keyframes hint{0%{opacity:0}10%{opacity:.85}74%{opacity:.85}100%{opacity:0}}
  .frame:focus-visible{outline:none}
</style>
</head>

    <div class="seam" id="seam"><div class="knob">
      <svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div></div>

    <div class="zc">
      <button id="zin"  aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&#8722;</button>
      <button id="zrst" class="lbl" aria-label="Reset view">FIT</button>
    </div>

    <div class="hint">one finger wipes · pinch / double-tap zoom · pan to edges</div>
  </div>
<script>
(function(){
  var frame=document.getElementById('frame');
  var scale=1, tx=0, ty=0, frac=0.5, L=100;
  var pointers=new Map(), gesture='none', seamDragging=false;
  var startX=0,startY=0, tapStart=null, lastTap=null, pinchPrev=null, panLast=null;
  var SMAX=7;

  function rect(){ return frame.getBoundingClientRect(); }
  function applySeam(){ frame.style.setProperty('--seam',(frac*100).toFixed(3)+'%');
                        frame.setAttribute('aria-valuenow',Math.round(frac*100)); }
  function applyXf(){ frame.style.setProperty('--tx',tx+'px');
                      frame.style.setProperty('--ty',ty+'px');
                      frame.style.setProperty('--s',scale.toFixed(4)); }
  function setL(){ var r=rect(); L=Math.max(r.width,r.height);
                   frame.style.setProperty('--L',L+'px'); }
  // keep the square covering the viewport at all times
  function clampPan(){ var r=rect(), span=L*scale;
    tx=Math.min(0,Math.max(r.width-span,tx));
    ty=Math.min(0,Math.max(r.height-span,ty)); }
  function recenter(){ var r=rect(); scale=1; tx=(r.width-L)/2; ty=(r.height-L)/2; applyXf(); }
  function setFromX(x){ var r=rect(); frac=Math.min(1,Math.max(0,(x-r.left)/r.width)); applySeam(); }
  function zoomAt(fx,fy,ns){ ns=Math.min(SMAX,Math.max(1,ns));
    var wx=(fx-tx)/scale, wy=(fy-ty)/scale;
    tx=fx-ns*wx; ty=fy-ns*wy; scale=ns; clampPan(); applyXf(); }
  function toggleZoom(fx,fy){ zoomAt(fx,fy, scale>1.05?1:2.8); }
  function two(){ var a=[]; pointers.forEach(function(v){a.push(v);}); return a; }
  function relMidDist(p){ var r=rect();
    return { mx:(p[0].x+p[1].x)/2-r.left, my:(p[0].y+p[1].y)/2-r.top,
             d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1 }; }

  frame.addEventListener('pointerdown',function(e){
    frame.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){ gesture='pinch'; seamDragging=false; pinchPrev=relMidDist(two()); return; }
    if(e.pointerType==='mouse' && (e.shiftKey||e.button===1||e.button===2)){
      gesture='pan'; panLast={x:e.clientX,y:e.clientY}; e.preventDefault(); return; }
    gesture='maybe'; startX=e.clientX; startY=e.clientY; seamDragging=false;
    tapStart={t:Date.now(),x:e.clientX,y:e.clientY};
  });

  frame.addEventListener('pointermove',function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(gesture==='pinch' && pointers.size>=2){
      var c=relMidDist(two());
      tx+=(c.mx-pinchPrev.mx); ty+=(c.my-pinchPrev.my);
      zoomAt(c.mx,c.my, scale*(c.d/pinchPrev.d));
      pinchPrev=c; e.preventDefault(); return;
    }
    if(gesture==='pan' && panLast){
      tx+=e.clientX-panLast.x; ty+=e.clientY-panLast.y; panLast={x:e.clientX,y:e.clientY};
      clampPan(); applyXf(); e.preventDefault(); return;
    }
    if(gesture==='maybe' || gesture==='seam'){
      if(!seamDragging && Math.hypot(e.clientX-startX,e.clientY-startY)>6){ seamDragging=true; gesture='seam'; }
      if(seamDragging) setFromX(e.clientX);
    }
  });

  function endPointer(e){
    var now=Date.now();
    if(gesture==='maybe' && tapStart && (now-tapStart.t)<250 &&
       Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<8){
      var r=rect();
      if(lastTap && now-lastTap.t<300 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<32){
        toggleZoom(e.clientX-r.left,e.clientY-r.top); lastTap=null;
      } else { lastTap={t:now,x:e.clientX,y:e.clientY}; }
    }
    pointers.delete(e.pointerId);
    try{frame.releasePointerCapture(e.pointerId);}catch(_){}
    if(pointers.size===1){ gesture='locked'; seamDragging=false; }
    else if(pointers.size===0){ gesture='none'; seamDragging=false; pinchPrev=null; panLast=null; }
  }
  frame.addEventListener('pointerup',endPointer);
  frame.addEventListener('pointercancel',endPointer);

  frame.addEventListener('wheel',function(e){
    e.preventDefault(); var r=rect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, scale*Math.exp(-e.deltaY*0.0015));
  },{passive:false});
  frame.addEventListener('dblclick',function(e){ var r=rect(); toggleZoom(e.clientX-r.left,e.clientY-r.top); });
  frame.addEventListener('contextmenu',function(e){ e.preventDefault(); });

  function btn(id,fn){ var b=document.getElementById(id);
    ['pointerdown','pointerup','click'].forEach(function(t){ b.addEventListener(t,function(e){e.stopPropagation();}); });
    b.addEventListener('click',fn); }
  btn('zin', function(){ var r=rect(); zoomAt(r.width/2,r.height/2,scale*1.6); });
  btn('zout',function(){ var r=rect(); zoomAt(r.width/2,r.height/2,scale/1.6); });
  btn('zrst',function(){ recenter(); });

  frame.addEventListener('keydown',function(e){
    var r=rect(), s=e.shiftKey?0.1:0.02;
    if(e.key==='ArrowLeft'){frac=Math.max(0,frac-s);applySeam();e.preventDefault();}
    else if(e.key==='ArrowRight'){frac=Math.min(1,frac+s);applySeam();e.preventDefault();}
    else if(e.key==='Home'){frac=0;applySeam();e.preventDefault();}
    else if(e.key==='End'){frac=1;applySeam();e.preventDefault();}
    else if(e.key==='+'||e.key==='='){zoomAt(r.width/2,r.height/2,scale*1.6);e.preventDefault();}
    else if(e.key==='-'||e.key==='_'){zoomAt(r.width/2,r.height/2,scale/1.6);e.preventDefault();}
    else if(e.key==='0'){recenter();e.preventDefault();}
  });

  window.addEventListener('resize',function(){
    setL(); if(scale<=1.0001){ recenter(); } else { clampPan(); applyXf(); } applySeam();
  });

  setL(); recenter(); applySeam();
})();
</script>
